name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build for a release (enables code signing when a certificate secret exists)
        type: boolean
        default: false
    secrets:
      GAMESHUB_SIGN_PFX_BASE64:
        required: false
      GAMESHUB_SIGN_PFX_PASSWORD:
        required: false
      GAMESHUB_SGDB_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  hygiene:
    name: 1 · Hygiene & secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false

      - name: Repository hygiene
        run: ./ci/stages/Hygiene.ps1

      - name: Secret scan of the full git history (gitleaks, pinned + checksum-verified)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p dist/reports
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path dist/reports/gitleaks.sarif .

      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-hygiene
          path: dist/reports/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: 2 · Web UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Static analysis + unit tests
        run: ./ci/stages/Web.ps1
      - name: Upload web reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-web
          path: dist/reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: 3-4 · Build, unit tests & package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Strict build, unit tests, reproducibility
        env:
          GAMESHUB_SGDB_KEY: ${{ secrets.GAMESHUB_SGDB_KEY }}
        run: ./ci/stages/Build.ps1

      - name: Package & verify installer
        env:
          GAMESHUB_SIGN_PFX_BASE64: ${{ inputs.release && secrets.GAMESHUB_SIGN_PFX_BASE64 || '' }}
          GAMESHUB_SIGN_PFX_PASSWORD: ${{ inputs.release && secrets.GAMESHUB_SIGN_PFX_PASSWORD || '' }}
          GAMESHUB_REQUIRE_SIGNATURE: ${{ inputs.release && secrets.GAMESHUB_SIGN_PFX_BASE64 != '' && '1' || '0' }}
          GAMESHUB_SGDB_KEY: ${{ secrets.GAMESHUB_SGDB_KEY }}
        run: ./ci/stages/Package.ps1

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: dist/package/
          if-no-files-found: error
          retention-days: 30
      - name: Upload app folder (for E2E file comparison)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: dist/app/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-build
          path: dist/reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: 5 · End-to-end (install → run → upgrade → uninstall)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Ensure the WebView2 Runtime (preinstalled on Windows 11; installed here if the image lacks it)
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if ($pv -and $pv -ne '0.0.0.0') { "WebView2 Runtime $pv present"; exit 0 }
          Write-Host 'WebView2 Runtime missing: installing the Evergreen bootstrapper'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\wv2setup.exe"
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\wv2setup.exe"
          $microsoft = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -cne $microsoft) { throw "Unexpected signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          Start-Process "$env:RUNNER_TEMP\wv2setup.exe" -ArgumentList '/silent', '/install' -Wait
          "WebView2 Runtime $((Get-ItemProperty $key).pv) installed"

      - name: Download installer (the exact artifact that will be published)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: dist/package
      - name: Download app folder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app
          path: dist/app
      - name: Verify artifact checksum
        run: |
          $f = Get-ChildItem dist/package/GamesHub-Setup-*.exe | Select-Object -First 1
          $expected = ((Get-Content "$($f.FullName).sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Checksum mismatch: $expected vs $actual" }
          "Checksum OK: $actual"
      - name: End-to-end smoke test
        run: ./ci/stages/E2E.ps1 -Mode Installer
      - name: Upload E2E evidence (screenshots, logs, results)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: |
            dist/e2e/
            dist/reports/
          if-no-files-found: ignore
          retention-days: 14

  passed:
    name: ✔ All checks passed
    if: always()
    needs: [hygiene, web, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "::error::A pipeline job did not succeed ($r)"; exit 1; }; done
