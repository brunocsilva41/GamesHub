<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>GamesHub</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preload" href="fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/bigpicture.css">
<link rel="stylesheet" href="css/features.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app" class="app">
  <header id="titlebar" class="titlebar"></header>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegação"></aside>
    <main id="main" class="main">
      <div id="update-banner" class="update-banner" role="region" aria-label="Atualização disponível" hidden></div>
      <section id="view-library" class="view view-library" aria-label="Biblioteca"></section>
      <section id="view-game" class="view view-game" aria-label="Detalhes do jogo" hidden></section>
      <section id="view-settings" class="view view-settings" aria-label="Configurações" hidden></section>
      <section id="app-error" class="view view-error" role="alert" hidden></section>
    </main>
  </div>
</div>
<div id="bigpicture" class="bigpicture" role="dialog" aria-modal="true" aria-label="Modo tela cheia" hidden></div>
<div id="drop-overlay" class="drop-overlay" hidden>
  <div class="drop-card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9m-5 5 5-5 5 5M5 4h14"/></svg>
    <strong>Solte para adicionar à biblioteca</strong>
    <span>Atalhos (.lnk, .url) ou executáveis (.exe)</span>
  </div>
</div>
<div class="pad-hints" aria-hidden="true">
  <span><i class="pad-btn pad-a">A</i>Jogar</span><span><i class="pad-btn pad-x">X</i>Detalhes</span>
  <span><i class="pad-btn pad-y">Y</i>Favoritar</span><span><i class="pad-btn pad-b">B</i>Voltar</span>
  <span><i class="pad-btn pad-lb">LB</i><i class="pad-btn pad-rb">RB</i>Seção</span>
  <span><i class="pad-btn pad-view">View</i>Buscar</span><span><i class="pad-btn pad-start">Start</i>Tela cheia</span>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="menu-root"></div>
<noscript>O GamesHub precisa de JavaScript habilitado.</noscript>
</body>
</html>
