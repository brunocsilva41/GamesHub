<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GamesHub</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:block;src:url('fonts/outfit-var.woff2') format('woff2')}
:root{
  --bg0:#0b0d16;
  --bg1:#0f1220;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --txt:#eef0f8;
  --mut:#a3accc;
  --mut2:#7d86a8;
  --vio:#a78bfa;
  --cyan:#3fe0ff;
  --grad:linear-gradient(135deg,#7c5cff 0%,#22d3ee 100%);
  --grad-soft:linear-gradient(135deg,rgba(124,92,255,.55),rgba(34,211,238,.45));
  --danger:#ff6b7a;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Outfit','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  font-size:14px;font-optical-sizing:auto;
  background:var(--bg0);color:var(--txt);
  user-select:none;-webkit-user-select:none;
}
/* ---------- ambient background ---------- */
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgfx::before{
  content:'';position:absolute;width:70vw;height:70vh;left:-18vw;top:-30vh;
  background:radial-gradient(closest-side,rgba(124,92,255,.16),transparent 70%);
}
#bgfx::after{
  content:'';position:absolute;width:70vw;height:70vh;right:-22vw;bottom:-34vh;
  background:radial-gradient(closest-side,rgba(34,211,238,.13),transparent 70%);
}
#bgfx .grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 40%,transparent 100%);
}
/* ---------- layout ---------- */
#app{position:relative;display:flex;height:100vh;z-index:1}
#sidebar{
  width:246px;flex:0 0 246px;display:flex;flex-direction:column;gap:4px;
  padding:20px 14px 18px;
  background:rgba(11,13,22,.62);
  backdrop-filter:blur(28px) saturate(150%);
  -webkit-backdrop-filter:blur(28px) saturate(150%);
  border-right:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;cursor:default}
.logo .orb{
  width:32px;height:32px;border-radius:9px;flex:0 0 32px;object-fit:cover;
  box-shadow:0 6px 18px rgba(124,92,255,.45);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  animation:logoglow 4s ease-in-out infinite;
}
.logo:hover .orb{transform:rotate(-8deg) scale(1.08)}
.logo b{
  font-size:17px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#cdbaff,#7ef0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoglow 4s ease-in-out infinite;
}
@keyframes logoglow{0%,100%{opacity:1}50%{opacity:.88}}
.navgrp{
  font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--mut2);
  padding:12px 10px 8px;
}
.nav{
  display:flex;flex-direction:column;gap:3px;
}
.nav a{
  display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:12px;
  color:var(--mut);text-decoration:none;font-size:13.5px;font-weight:600;position:relative;
  cursor:default;
  transition:background .18s,color .18s,transform .18s ease,padding-left .18s ease;
  animation:navIn .42s ease both;animation-delay:calc(var(--i,0)*38ms);
}
.nav a .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;transition:transform .18s ease}
.nav a .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .cnt{
  font-size:11px;font-weight:700;color:var(--mut2);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  padding:1px 7px;border-radius:999px;transition:transform .18s ease;
}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--txt);transform:translateX(4px);padding-left:13px}
.nav a:hover .dot{transform:scale(1.2)}
.nav a.active{
  background:rgba(124,92,255,.15);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.22);
}
.nav a.active::before{
  content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad);
  animation:growBar .28s cubic-bezier(.2,.8,.2,1) both;transform-origin:center;
}
.nav a.active .cnt{color:#fff;background:rgba(124,92,255,.28);border-color:rgba(168,146,255,.35)}
.spacer{flex:1}
/* ---------- sidebar bottom ---------- */
.sidebtn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:11px;border-radius:13px;border:1px solid transparent;
  font-family:inherit;font-size:13.5px;font-weight:700;color:#fff;
  cursor:default;transition:transform .15s,box-shadow .15s,filter .15s;
}
.sidebtn.primary{background:var(--grad);box-shadow:0 8px 22px rgba(124,92,255,.4)}
.sidebtn.primary:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 10px 26px rgba(124,92,255,.55)}
.sidebtn.ghost{margin-top:8px;background:rgba(255,255,255,.05);border-color:var(--line);color:var(--mut)}
.sidebtn.ghost:hover{color:#fff;background:rgba(255,255,255,.09)}
.sidebtn svg{width:15px;height:15px}
/* ---------- main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{
  height:62px;flex:0 0 62px;display:flex;align-items:center;gap:16px;padding:0 26px;
  -webkit-app-region:drag;
}
#topbar.no-drag *{-webkit-app-region:no-drag}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb h1{font-size:20px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.crumb .sub{font-size:12px;color:var(--mut2);font-weight:600;white-space:nowrap}
.search{
  flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:9px;
  height:38px;padding:0 15px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  -webkit-app-region:no-drag;
  transition:border .18s,box-shadow .18s,background .18s;
}
.search:focus-within{background:rgba(255,255,255,.07);border-color:rgba(167,139,250,.65);box-shadow:0 0 0 3.5px rgba(124,92,255,.18)}
.search svg{width:15px;height:15px;color:var(--mut2);flex:0 0 15px}
.search input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--txt);font-family:inherit;font-size:13.5px;user-select:text;-webkit-user-select:text;
}
.search input::placeholder{color:var(--mut2)}
.winctrls{display:flex;gap:7px;-webkit-app-region:no-drag}
.winbtn{
  width:36px;height:32px;border-radius:9px;border:none;display:grid;place-items:center;
  background:transparent;color:var(--mut);cursor:default;transition:background .12s,color .12s;
}
.winbtn svg{width:15px;height:15px}
.winbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.winbtn.close:hover{background:rgba(255,80,100,.85);color:#fff}
/* ---------- scroll area ---------- */
#scroll{flex:1;overflow-y:auto;padding:8px 26px 46px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
#scroll::-webkit-scrollbar{width:10px}
#scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
#scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.22)}
/* ---------- hero ---------- */
#hero{
  position:relative;height:318px;margin-top:6px;border-radius:26px;overflow:hidden;
  border:1px solid var(--line);background:#0d101d;
}
#hero .wall{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);filter:saturate(.9)}
#hero .wall::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(8,10,18,.97) 4%,rgba(10,12,22,.82) 42%,rgba(12,14,24,.25) 78%,rgba(13,16,28,.05));}
#hero .glow{position:absolute;right:-70px;top:-70px;width:420px;height:420px;border-radius:50%;background:var(--grad-soft);filter:blur(90px);opacity:.5}
#hero .inner{position:absolute;inset:0;display:flex;align-items:center;padding:0 44px;gap:40px}
#hero .meta{flex:1.15;min-width:0;z-index:2;animation:fadeUp .5s ease both}
#hero .chip{
  display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.4px;color:#d9c9ff;
  background:rgba(124,92,255,.16);border:1px solid rgba(167,139,250,.35);
  padding:5px 12px;border-radius:999px;margin-bottom:14px;
}
#hero .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--grad)}
#hero h2{font-size:37px;font-weight:800;letter-spacing:-.4px;line-height:1.06;max-width:620px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#hero .tags{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#hero .tags .pf{font-size:12.5px;font-weight:700;color:var(--mut);display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:4.5px 11px;border-radius:999px}
#hero .tags .pf .dot{width:8px;height:8px;border-radius:50%}
#hero .btns{margin-top:22px;display:flex;gap:12px;align-items:center}
.btnplay{
  display:inline-flex;align-items:center;gap:9px;padding:12px 24px;border-radius:14px;border:none;
  background:var(--grad);color:#fff;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 12px 30px rgba(124,92,255,.5);cursor:default;transition:transform .15s,box-shadow .18s,filter .18s;
}
.btnplay:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 16px 38px rgba(124,92,255,.62)}
.btnplay svg{width:15px;height:15px}
.btnghost{
  padding:12px 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);
  color:var(--txt);font-family:inherit;font-size:13.5px;font-weight:700;cursor:default;
  transition:background .15s,border-color .15s;
}
.btnghost:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
#hero .art{flex:0 0 300px;height:200px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);position:relative;z-index:2;box-shadow:0 30px 70px rgba(0,0,0,.55);animation:pop .5s .08s ease both}
#hero .art img{width:100%;height:100%;object-fit:cover;display:block}
#hero .art .artico{position:relative;width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#161a2e,#2b3153)}
#hero .art .artico img{width:62%;height:62%;object-fit:contain;filter:drop-shadow(0 16px 34px rgba(0,0,0,.55))}
#hero .art .artico .ph-cover{border-radius:18px}
.chevrons{position:absolute;right:20px;bottom:18px;display:flex;gap:8px;z-index:3;-webkit-app-region:no-drag}
.chev{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(12,14,22,.55);backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;cursor:default;
  transition:background .15s,transform .15s;
}
.chev:hover{background:rgba(124,92,255,.55);transform:scale(1.06)}
.chev svg{width:15px;height:15px}
.heroi{position:absolute;right:22px;bottom:64px;font-size:12px;font-weight:800;color:rgba(255,255,255,.6);z-index:3;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
/* ---------- library ---------- */
#lib{margin-top:34px}
.libhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.libhead h3{font-size:19px;font-weight:800;letter-spacing:.2px}
.libhead .pill{font-size:11.5px;font-weight:800;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:2.5px 10px;border-radius:999px}
/* ---------- grid ---------- */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px 18px}
.card{position:relative;cursor:default;animation:fadeUp .4s ease both}
.card .cover{
  position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;
  background:#11141f;border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s;
}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card:hover .cover{transform:translateY(-5px);border-color:rgba(167,139,250,.35);box-shadow:0 20px 44px rgba(0,0,0,.55),0 6px 20px rgba(124,92,255,.22)}
.card:hover .cover img{transform:scale(1.07)}
.card.hide{display:none}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(5,7,12,.72));opacity:0;transition:opacity .22s}
.card:hover .shade{opacity:1}
.cover .play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55);opacity:0;
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:rgba(12,14,22,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);color:#fff;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s;
}
.card:hover .play{transform:translate(-50%,-50%) scale(1);opacity:1}
.cover .play svg{width:17px;height:17px;margin-left:2px}
.ph{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#dfe3ff;background:rgba(9,11,18,.62);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .2s}
.card:hover .ph{opacity:1}
.ph .dot{width:7px;height:7px;border-radius:50%}
.card .meta{padding:9px 3px 0}
.card .t{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:11px;color:var(--mut2);font-weight:600;margin-top:2px}
/* placeholder cover */
.ph-cover{position:absolute;inset:0;display:grid;place-items:center}
.ph-cover .mono{font-size:34px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:-1px;text-shadow:0 4px 16px rgba(0,0,0,.4)}
.ph-cover .pat{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);background-size:14px 14px}
.ph-cover img.ico{position:relative;width:64%;height:64%;object-fit:contain;z-index:2;filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
/* ---------- context menu ---------- */
#ctx{position:fixed;min-width:190px;z-index:60;display:none;padding:6px;border-radius:14px;background:rgba(16,18,28,.9);backdrop-filter:blur(26px);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(0,0,0,.6)}
#ctx .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt)}
#ctx .it:hover{background:rgba(124,92,255,.18);color:#fff}
#ctx .it.danger{color:#ff97a1}
#ctx .it.danger:hover{background:rgba(255,80,100,.16)}
#ctx .sep{height:1px;background:var(--line);margin:5px 8px}
/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{
  display:flex;align-items:center;gap:11px;padding:12px 18px;border-radius:14px;
  background:rgba(16,18,28,.92);backdrop-filter:blur(22px);border:1px solid var(--line2);
  font-size:13px;font-weight:600;color:var(--txt);box-shadow:0 18px 44px rgba(0,0,0,.5);
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both;
}
.toast .ic{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.toast.ok .ic{background:#34d399;box-shadow:0 0 10px #34d399}
.toast.err .ic{background:#ff6b7a;box-shadow:0 0 10px #ff6b7a}
/* ---------- confirm modal ---------- */
#modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.6);backdrop-filter:blur(6px)}
#modal.show{display:flex;animation:fadeIn .18s ease}
#modal .box{width:340px;background:rgba(18,20,32,.97);backdrop-filter:blur(30px);border:1px solid var(--line2);border-radius:20px;padding:26px;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pop .22s ease}
#modal h4{font-size:16px;font-weight:800;margin-bottom:8px}
#modal p{font-size:13.5px;color:var(--mut);line-height:1.5;margin-bottom:22px}
#modal .row{display:flex;gap:10px;justify-content:flex-end}
#modal .row button{font-family:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:11px;cursor:default}
#modal .row .no{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:var(--txt)}
#modal .row .yes{background:var(--grad);border:none;color:#fff}
/* ---------- empty ---------- */
#empty{display:none;text-align:center;padding:70px 20px 40px;color:var(--mut2)}
#empty.show{display:block;animation:fadeUp .4s ease}
#empty .big{width:90px;height:90px;border-radius:26px;background:rgba(255,255,255,.04);border:1px dashed var(--line2);display:grid;place-items:center;margin:0 auto 20px}
#empty h3{color:var(--txt);font-size:17px;font-weight:800;margin-bottom:6px}
#empty p{font-size:13.5px;line-height:1.6;max-width:360px;margin:0 auto 22px}
/* ---------- skeleton ---------- */
.sk{position:relative;overflow:hidden;background:#12152a}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shine 1.3s infinite}
.sk-hero{height:318px;border-radius:26px;margin-top:6px}
.sk-card{border-radius:var(--r);aspect-ratio:16/9}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes navIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes growBar{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
</style>
</head>
<body>
<div id="bgfx"><div class="grid"></div></div>

<div id="app">
  <aside id="sidebar">
    <div class="logo">
      <img class="orb" src="/logo.png" alt="GamesHub">
      <b>GAMESHUB</b>
    </div>
    <div class="navgrp">BIBLIOTECA</div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <button class="sidebtn primary" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar jogo
    </button>
    <button class="sidebtn ghost" id="btnPin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6M12 4v6l4 3v2H8v-2l4-3V4M9 19h6"/></svg>
      Manter no topo
    </button>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="crumb"><h1 id="crumbTitle">Todos</h1><span class="sub" id="crumbCount"></span></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Pesquisar jogos  (Ctrl+F)" spellcheck="false">
      </div>
      <div class="winctrls">
        <button class="winbtn" id="btnMin" title="Minimizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="winbtn close" id="btnClose" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>

    <div id="scroll">
      <div id="hero" style="display:none"></div>
      <div class="sk sk-hero" id="skHero"></div>

      <div id="lib" style="display:none">
        <div class="libhead"><h3>Seus jogos</h3><span class="pill" id="gridCount"></span></div>
        <div id="grid"></div>
        <div id="empty">
          <div class="big">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 16V9l4-4h8l4 4v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 16l4-2 4 2 4-2 4 2"/></svg>
          </div>
          <h3>Nenhum jogo por aqui</h3>
          <p>Adicione jogos pelo botão &ldquo;Adicionar jogo&rdquo; ou coloque atalhos (.lnk/.url/.exe) na pasta <b id="emptypath"></b>.</p>
          <button class="btnplay" id="btnEmptyAdd" style="margin:0 auto">Adicionar jogo</button>
        </div>
      </div>

      <div class="sk sk-card" id="skGrid" style="margin-top:34px"></div>
    </div>
  </div>
</div>

<div id="ctx"></div>
<div id="toasts"></div>
<div id="modal">
  <div class="box">
    <h4 id="modalTitle">Remover jogo</h4>
    <p id="modalMsg">Tem certeza?</p>
    <div class="row"><button class="no" id="modalNo">Cancelar</button><button class="yes" id="modalYes">Remover</button></div>
  </div>
</div>

<script>
"use strict";
const BASE = (location.origin && location.origin.startsWith("http")) ? location.origin : "http://127.0.0.1:8456";
function post(o){
  try { return fetch(BASE + "/api/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) }).catch(() => {}); } catch (_) { return null; }
}
window.addEventListener("error", ev => { try { post({ cmd: "log", path: "JSERR:" + (ev.message || "?") }); } catch (_) {} });
window.addEventListener("unhandledrejection", ev => { try { post({ cmd: "log", path: "PROM:" + (ev.reason && ev.reason.message) }); } catch (_) {} });

/* ---------------- data ---------------- */
let GAMES = [];
let FILTER = "Todos";
let QUERY = "";
let FEAT = { pool: [], idx: 0 };
let ctxPath = null;
let pinOn = false;

const PLATS = {
  "Todos":  { label: "Todos",  color: "#cdd3ea" },
  "Steam":  { label: "Steam",  color: "#66c0f4" },
  "Riot":   { label: "Riot",   color: "#ff5c8a" },
  "Roblox": { label: "Roblox", color: "#3ddc84" },
  "Minecraft": { label: "Minecraft", color: "#6cd05a" },
  "Epic":   { label: "Epic",   color: "#e04397" },
  "PC":     { label: "PC",     color: "#bec4e0" }
};
const PALLETE = [
  "linear-gradient(135deg,#7c5cff,#22d3ee)",
  "linear-gradient(135deg,#f43f5e,#f59e0b)",
  "linear-gradient(135deg,#22d3ee,#34d399)",
  "linear-gradient(135deg,#e04397,#7c5cff)",
  "linear-gradient(135deg,#38bdf8,#8b5cf6)",
  "linear-gradient(135deg,#f97316,#ef4444)",
  "linear-gradient(135deg,#a3e635,#22d3ee)",
  "linear-gradient(135deg,#e879f9,#6366f1)"
];
const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const coverBg = (g) => PALLETE[hash(g.path) % PALLETE.length];

/* ---------------- rendering helpers ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const fmtShow = (g) => g.platform === "PC" ? "PC" : g.platform;

function navItems(){
  const items = [];
  for (const k in PLATS){
    items.push({ key: k, ...PLATS[k] });
  }
  return items;
}

function counts(){
  const c = { "Todos": GAMES.length };
  for (const k in PLATS){ if (k === "Todos") continue; c[k] = GAMES.filter(g => g.platform === k).length; }
  return c;
}

function renderNav(){
  const c = counts();
  $("#nav").innerHTML = navItems().map((n, i) => `
    <a class="${FILTER === n.key ? "active" : ""}" data-k="${esc(n.key)}" style="--i:${i}">
      <span class="dot" style="background:${n.color};box-shadow:0 0 9px ${n.color}55"></span>
      <span class="lbl">${n.label}</span>
      <span class="cnt">${c[n.key] || 0}</span>
    </a>`).join("");
}

function visibleGames(){
  return GAMES.filter(g => {
    const okf = FILTER === "Todos" || g.platform === FILTER;
    const q = QUERY.trim().toLowerCase();
    const okq = !q || g.name.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q);
    return okf && okq;
  });
}

/* ---------------- hero ---------------- */
function fmtAgo(t){
  const d = new Date(t);
  if (isNaN(d.getTime())) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "agora mesmo";
  const m = Math.floor(s / 60);
  if (m < 60) return m === 1 ? "há 1 minuto" : "há " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return h === 1 ? "há 1 hora" : "há " + h + " h";
  const days = Math.floor(h / 24);
  return days === 1 ? "ontem" : "há " + days + " dias";
}

function buildHeroPool(){
  let pool = GAMES.filter(g => g.feat !== false && (g.cover || g.icon));
  if (!pool.length) pool = GAMES.slice();
  pool = pool.slice().sort((a, b) => {
    const ta = a.last ? new Date(a.last).getTime() : 0;
    const tb = b.last ? new Date(b.last).getTime() : 0;
    return tb - ta;
  });
  FEAT.pool = pool;
  FEAT.idx = 0;
}

function heroArt(g){
  if (g.cover)
    return `<div class="art"><img src="/covers/${encodeURIComponent(g.cover)}" alt=""></div>`;
  if (g.icon)
    return `<div class="art"><div class="artico"><img src="/icons/${encodeURIComponent(g.icon)}" alt=""></div></div>`;
  return `<div class="art"><div class="artico"><div class="ph-cover" style="background:${coverBg(g)}"><div class="pat"></div><div class="mono">${esc(g.name.charAt(0).toUpperCase())}</div></div></div></div>`;
}

function renderHero(){
  const g = FEAT.pool[FEAT.idx];
  if (!g){ $("#hero").style.display = "none"; return; }
  const ph = PLATS[g.platform] || PLATS.PC;
  $("#hero").style.display = "block";
  const wall = g.cover
    ? `<div class="wall" style="background-image:url('/covers/${encodeURIComponent(g.cover)}')"></div>`
    : `<div class="wall" style="background:linear-gradient(115deg,rgba(124,92,255,.30),rgba(34,211,238,.18) 55%,transparent)"></div>`;
  $("#hero").innerHTML = `
    ${wall}
    <div class="glow"></div>
    <div class="inner">
      <div class="meta">
        <span class="chip"><span class="dot"></span>EM DESTAQUE</span>
        <h2>${esc(g.name)}</h2>
        <div class="tags">
          <span class="pf"><span class="dot" style="background:${ph.color}"></span>${ph.label}</span>
          <span class="pf">${g.ext.replace(".","").toUpperCase()}</span>
          ${g.appid ? `<span class="pf">Steam #${g.appid}</span>` : ""}
          ${g.last ? `<span class="pf">Jogado ${fmtAgo(g.last)}</span>` : `<span class="pf">Nunca jogado</span>`}
        </div>
        <div class="btns">
          <button class="btnplay" data-act="play" data-path="${esc(g.path)}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg> JOGAR
          </button>
          <button class="btnghost" data-act="folder" data-path="${esc(g.path)}">Abrir pasta</button>
        </div>
      </div>
      ${heroArt(g)}
    </div>
    <div class="heroi">${FEAT.idx + 1} / ${FEAT.pool.length}</div>
    <div class="chevrons">
      <button class="chev" id="heroPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="chev" id="heroNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>`;
  $("#heroPrev").onclick = () => { FEAT.idx = (FEAT.idx - 1 + FEAT.pool.length) % FEAT.pool.length; renderHero(); };
  $("#heroNext").onclick = () => { FEAT.idx = (FEAT.idx + 1) % FEAT.pool.length; renderHero(); };
  $("#hero .meta").style.animation = "none"; void $("#hero .meta").offsetHeight; $("#hero .meta").style.animation = "";
}

/* ---------------- grid ---------------- */
function renderGrid(){
  const list = visibleGames();
  $("#gridCount").textContent = `${list.length} de ${GAMES.length}`;
  $("#grid").innerHTML = list.map((g, i) => {
    const ph = PLATS[g.platform] || PLATS.PC;
    const art = g.cover ? `<img src="/covers/${encodeURIComponent(g.cover)}" alt="" loading="lazy" onerror="this.remove()">` :
      g.icon ? `<div class="ph-cover" style="background:${coverBg(g)}"><div class="pat"></div><img class="ico" src="/icons/${encodeURIComponent(g.icon)}" alt=""></div>` :
      `<div class="ph-cover" style="background:${coverBg(g)}"><div class="pat"></div><div class="mono">${esc(g.name.charAt(0).toUpperCase())}</div></div>`;
    return `
    <div class="card${g.hide ? " hide" : ""}" style="animation-delay:${Math.min(i * 34, 420)}ms" data-path="${esc(g.path)}">
      <div class="cover">
        ${art}
        <div class="shade"></div>
        <span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg></span>
        <span class="ph"><span class="dot" style="background:${ph.color}"></span>${ph.label}</span>
      </div>
      <div class="meta">
        <div class="t">${esc(g.name)}</div>
        <div class="s">${esc(fmtShow(g))} · ${g.ext.replace(".","").toUpperCase()}</div>
      </div>
    </div>`;
  }).join("");
  $("#empty").classList.toggle("show", list.length === 0);
  $("#lib").style.display = list.length === 0 ? "block" : "block";
  $("#gridCount").textContent = list.length ? `${list.length} de ${GAMES.length}` : "";
}

/* ---------------- events (grid delegation) ---------------- */
function showCtx(x, y){
  const m = $("#ctx");
  m.style.display = "block";
  m.innerHTML = `
    <div class="it" data-a="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg> Jogar</div>
    <div class="it" data-a="folder"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h7l2 2h9v9a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V7z"/></svg> Abrir pasta de origem</div>
    <div class="sep"></div>
    <div class="it danger" data-a="remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg> Remover do hub</div>`;
  const rect = { w: 200, h: m.offsetHeight };
  let lx = x, ly = y;
  if (lx + rect.w > innerWidth - 8) lx = innerWidth - rect.w - 8;
  if (ly + rect.h > innerHeight - 8) ly = innerHeight - rect.h - 8;
  m.style.left = lx + "px"; m.style.top = ly + "px";
}
function hideCtx(){ $("#ctx").style.display = "none"; }

function launch(p){ post({ cmd: "launch", path: p }); toast("Iniciando..."); }
function openFolder(p){ post({ cmd: "openFolder", path: p }); }
function askRemove(p){
  ctxPath = p;
  $("#modalTitle").textContent = "Remover jogo";
  const g = GAMES.find(g => g.path === p);
  $("#modalMsg").textContent = `O atalho de "${g ? g.name : "este jogo"}" será movido para a lixeira do hub (pasta _removidos).`;
  $("#modal").classList.add("show");
}
function confirmRemove(){ if (ctxPath) post({ cmd: "remove", path: ctxPath }); ctxPath = null; $("#modal").classList.remove("show"); }

let ctxActive = null;
$("#grid").addEventListener("click", e => {
  const cardEl = e.target.closest(".card");
  if (!cardEl) return;
  launch(cardEl.dataset.path);
});
$("#grid").addEventListener("contextmenu", e => {
  e.preventDefault();
  const el = e.target.closest(".card");
  if (!el) return;
  const g = GAMES.find(g => g.path === el.dataset.path);
  ctxActive = g;
  showCtx(e.clientX, e.clientY);
});
$("#ctx").addEventListener("click", e => {
  const it = e.target.closest(".it");
  if (!it) return;
  const p = ctxActive ? ctxActive.path : null;
  ctxActive = null; hideCtx();
  if (it.dataset.a === "play") launch(p);
  else if (it.dataset.a === "folder") openFolder(p);
  else if (it.dataset.a === "remove") askRemove(p);
});

document.addEventListener("click", e => { if (!e.target.closest("#ctx")) hideCtx(); });
document.addEventListener("contextmenu", e => { if (!e.target.closest("#grid")) hideCtx(); });

/* ---------------- controls ---------------- */
$("#nav").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  FILTER = a.dataset.k;
  renderNav(); renderGrid();
  $("#crumbTitle").textContent = FILTER;
  const c = counts();
  $("#crumbCount").textContent = c[FILTER] ? `${c[FILTER]} jogos` : "";
});
$("#q").addEventListener("input", e => { QUERY = e.target.value; renderGrid(); });
$("#btnAdd").onclick = () => post({ cmd: "add" });
$("#btnEmptyAdd").onclick = () => post({ cmd: "add" });
$("#btnMin").onclick = () => post({ cmd: "min" });
$("#btnClose").onclick = () => post({ cmd: "close" });
$("#btnPin").onclick = () => {
  pinOn = !pinOn;
  post({ cmd: "pin", on: pinOn });
  $("#btnPin").style.background = pinOn ? "rgba(124,92,255,.25)" : "";
  $("#btnPin").style.color = pinOn ? "#fff" : "";
  $("#btnPin").style.borderColor = pinOn ? "rgba(167,139,250,.5)" : "";
  toast(pinOn ? "Janela fixada no topo" : "Fixação desativada");
};
$("#modalNo").onclick = () => { ctxPath = null; $("#modal").classList.remove("show"); $("#modalNo").blur(); };
$("#modalYes").onclick = confirmRemove;
$(".search").addEventListener("click", () => $("#q").focus());
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); $("#q").blur(); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f"){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (e.key === "Escape"){ hideCtx(); $("#modal").classList.remove("show"); }
  else if (e.key === "F5" || (e.key === "F2")) { e.preventDefault(); location.reload(); }
});

/* ---------------- hero actions ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const path = b.dataset.path;
  if (b.dataset.act === "play") launch(path);
  else if (b.dataset.act === "folder") openFolder(path);
});

/* ---------------- toast ---------------- */
function toast(text, kind){
  kind = kind || "ok";
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = `<span class="ic"></span><span>${esc(text)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s,transform .3s"; t.style.opacity = "0"; t.style.transform = "translateY(8px)"; setTimeout(() => t.remove(), 320); }, 3200);
}

/* ---------------- state (HTTP polling) ---------------- */
function applyGames(list){
  GAMES = list || [];
  post({ cmd: "log", path: "applied:" + GAMES.length });
  buildHeroPool();
  renderNav();
  renderGrid();
  renderHero();
  $("#skHero").remove();
  $("#skGrid").remove();
  $("#lib").style.display = "block";
  $("#crumbCount").textContent = GAMES.length ? `${GAMES.length} jogos` : "";
  $("#emptypath").textContent = "de jogos";
}

let lastStateKey = null;
let pollFails = 0;

function loadDemo(){
  if (GAMES.length) return;
  applyGames([
    { name: "Counter-Strike 2", path: "demo1", platform: "Steam", ext: ".url", cover: "x.jpg", appid: "730" },
    { name: "Valorant", path: "demo2", platform: "Riot", ext: ".lnk" },
    { name: "Roblox", path: "demo3", platform: "Roblox", ext: ".url" },
    { name: "Minecraft", path: "demo4", platform: "Minecraft", ext: ".lnk" }
  ]);
}

function poll(){
  if (document.hidden) return;
  fetch(BASE + "/api/state")
    .then(r => r.json())
    .then(d => {
      pollFails = 0;
      if (!d) return;
      const key = JSON.stringify(d.games || []);
      if (key !== lastStateKey){
        lastStateKey = key;
        applyGames(d.games || []);
      }
      (d.toasts || []).forEach(t => toast(t.text || "OK", t.kind === "err" ? "err" : "ok"));
    })
    .catch(() => {
      pollFails++;
      if (pollFails >= 3 && GAMES.length === 0) loadDemo();
    });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();
setInterval(poll, 1200);
</script>
</body>
</html>
